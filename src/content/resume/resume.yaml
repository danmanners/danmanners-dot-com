summary: |
  With over a decade in the IT industry, I have been able to use my problem solving
  abilities, ingenuity, and my knowledge of best-practices to support my clients'
  goals and the projects we work on.

  I thrive on tackling new challenges and engineering the best solutions. I am
  well-versed in automation tooling, cloud and on-prem networking, systems
  architecture, and SecOps. Additionally, I am experienced in troubleshooting at
  the hardware, software, and application levels of most systems put in front of me.

  I always aim to develop appropriate solutions for the appropriate time frames and
  within budget. I am always seeking new opportunities to develop cohesive systems
  which can provide the ideal environments for both developers and their end users.

