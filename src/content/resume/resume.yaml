summary: |
  With nearly twenty years in the tech industry, I have been able to use my problem solving
  abilities, ingenuity, and deep knowledge of best-practices to support my clients' goals
  and the projects we work on.

  I am currently focused on AWS Cloud, Kubernetes and cloud-native infrastructure, DevSecOps
  and security, AI-friendly and agentic engineering workflows, and mentoring engineering
  teams. I am experienced in designing and operating hyperscale Kubernetes platforms,
  building secure CI/CD pipelines, and implementing infrastructure as code at global scale.

  I always aim to develop appropriate solutions for the appropriate time frames and within
  budget. I am always seeking new opportunities to develop cohesive systems which can
  provide the ideal environments for both developers and their end users.

experiences:
  - position: "Principal Architect"
    dates: "2026 - Present"
    company: "CentralReach"
    details: |-
      - Serving as the organization's dedicated platform and infrastructure engineer, designing, building, and operating AWS cloud-native infrastructure, Kubernetes platforms, CI/CD pipelines, and security controls end-to-end.
      - Building AI-friendly and agentic workflows into engineering practices to increase developer velocity and operational efficiency.
      - Mentoring engineers on cloud-native architecture, DevSecOps practices, and security best practices.
  - position: "Senior Site Reliability Engineer"
    dates: "2021 - 2025"
    company: "Cisco"
    details: |-
      - Designed and implemented hyperscaling Kubernetes on-premises via OpenStack, Cluster API, and Talos Linux to provide elastic compute for secure build environments.
      - Enabled GitHub Actions in GitHub EMU for all of Cisco Engineering and implemented risk mitigation strategies against supply chain attacks. Developed and maintained a Cisco Hardened GitHub Action Runner container image to secure the runtime environment.
      - Designed, built, and deployed an SSDF Compliant GitHub Action Workflow Logging solution in less than 45 days to support logging for thousands of GitHub Action Workflows daily.
      - Built an internal Python library to safely and securely manage GitHub App authentication against GitHub Cloud and dozens of GitHub Enterprise servers for thousands of organizations.
      - Designed and implemented idempotent infrastructure and services at global scale via Terraform, GitOps, and Kubernetes in AWS. Brought new region infrastructure and service provisioning from several days to 1 hour. Reduced global infrastructure upgrade times in cloud environments from several hours to 30 minutes. Reduced upgrade times for services from 2-4 hours to 10 minutes.
      - Mentored junior engineers on approaching cloud-native software, solutions, and engineering challenges with a focus on aligning to business values and goals.
  - position: "DevOps Engineer"
    dates: "2020 - 2021"
    company: "Cisco (TEKSystems Contract)"
    details: "Working with the Engineering IT team to design, build and implement a platform to streamline code and package deployment to both internal and zero-trust partner locations."
  - position: "Senior Network Engineer, Systems and Design"
    dates: "2019 - 2020"
    company: "TOURtech"
    details: "Building and implementing better systems for deploying the necessary configurations to different types of devices; working with the Field Services team to ensure that on-site issues are handled appropriately and in a timely manner; working on bettering both the customer experience as well as both the on-site and remote administration experience with technology."
  - position: "DevOps Engineer"
    dates: "2017 - 2019"
    company: "BrainGu, LLC"
    details: "Worked collaboratively with developers, project managers, and upper management to guarantee end products and results that both we and our customers love. Primarily worked on the Structsure Project building out the system architecture and automated deployment and updating functionality of the application being built."
  - position: "Network Engineer / Manager of IT Services"
    dates: "2014 - 2017"
    company: "TOURtech"
    details: "Worked with both internal and external teams to guarantee success at the events we built and operated. Helped coordinate 50+ shows during my tenure. Built the 'Tech Wiki' for configuration and knowledge management."
  - position: "Systems Administrator I/II"
    dates: "2010 - 2014"
    company: "Production Resource Group"
    details: "Played a key role in maintaining day-to-day functionality of all networked services (asset management platform, Cisco phones, print services, networked storage, facility access control, security system management, day-to-day hardware/software problems, client and project management, etc.) both locally and nationwide."

