    tagline: "Built out a highly scalable platform, primarily around Open Source Software, to allow simultaneous remote management and support to multiple event sites. This includes CCTV cameras, temporary wired and wireless infrastructure, logging and metrics collection, and integration with on-site radio communications. CAPCOM provides the ability for a less-qualified network technician on multiple event sites while a highly-trained remote Network Engineer can oversee simultaneous live events from a single physical location."
