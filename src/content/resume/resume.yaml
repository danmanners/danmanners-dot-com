    url: "https://www.tourtech.com"
    tagline: "Built an easy-to-use web interface to generate TOURtech specific configuration files for the various hardware used by the organization on a per-event basis. This streamlined configuration management by nearly a full day of work per job."
  - title: "Structsure @ BrainGu"
    url: "https://www.structsure.com"
    tagline: "Compliant Platform-As-A-Service offering simplified deployments of necessary applications for almost any business."
